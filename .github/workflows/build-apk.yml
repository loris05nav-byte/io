name: Build APK

# Compile un APK Android installable (signé avec la clé de debug d'Expo) sans compte Expo/EAS.
# Récupération : onglet « Actions » du dépôt → exécution → « Artifacts » → folio-office-apk.
on:
  workflow_dispatch:
  push:
    branches: [ccr-cd052357-3aejjx, main]
    paths-ignore:
      - '**.md'
      - 'quiz.html'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifications (types + tests)
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      - name: Compiler l'APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: folio-office-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
